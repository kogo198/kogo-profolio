<section id="services" class="services-section">
  <div class="section-header">
    <p class="section-tag">MY SERVICES</p>
    <h2 class="section-title">
      Solution We Provide<br>
      For Your <span class="purple-text">Works</span>
    </h2>
  </div>

  <div class="services-grid-container">
    <!-- Left Column: Services Stack -->
    <div class="services-stack">
      <div class="service-card" *ngFor="let service of servicesList; let i = index" [class.active]="activeService === i" (click)="selectService(i)">
        <div class="service-icon-box">
          <svg [innerHtml]="service.iconSvg" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </div>

        <div class="service-body">
          <h3 class="service-title">{{ service.title }}</h3>
          <p class="service-desc">{{ service.description }}</p>
        </div>

        <button class="service-arrow-btn" aria-label="View Service">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- Right Column: Dashboard Mockup -->
    <div class="services-visual">
      <div class="visual-card-frame">
        <img src="dashboard-mockup.png" alt="SaaS Dashboard Analytics Mockup" class="mockup-img" />
      </div>
    </div>
  </div>
</section>
